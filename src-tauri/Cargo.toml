[package]
name = "dsh-window"
version = "0.1.0"
description = "DeepSeek Harness desktop window"
authors = ["dsh-window contributors"]
license = "MIT"
repository = "https://github.com/he110Warudo/dsh-window"
edition = "2021"

[lib]
name = "dsh_window_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
chrono = "0.4"
dirs = "6"
open = "5"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
